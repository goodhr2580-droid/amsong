function nx2(i){
 var P=PH[i],cut=1+Math.floor(Math.random()*(P.length-1)),o=[P[cut]],pool=[];
 PH.forEach(function(a,k){if(k!==i)a.forEach(function(x){pool.push(x)})});
 shuf(pool).slice(0,3).forEach(function(x){o.push(x)});
 return{t:'next',pre:P.slice(0,cut).join(' ')+' …',ans:P[cut],opts:shuf(o)};
}

}
